; YXAgent 配置文件
;
; 复制本文件为 config.ini 后填写实际值（config.ini 已被 .gitignore 忽略）。
; 也可通过环境变量覆盖：YXAGENT_BASE_URL / YXAGENT_API_KEY / YXAGENT_MODEL

[llm]
base_url = "http://127.0.0.1:1234/v1"
api_key = "your-api-key"
model = "qwen/qwen3-4b-2507"
; temperature = 0.7
; max_tokens = 2048

[agent]
; 单轮对话内允许的最大工具调用轮次
max_tool_rounds = 8
; 单次读取文件的最大字符数
max_read_chars = 8000
; 系统提示词（可留空）
; system_prompt = "你是一个 helpful 的命令行助手。"
